<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GradeX BITM</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #020202;
        color: #f5f5f5;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      p { color: #9a9a9a; font-size: 14px; line-height: 1.6; max-width: 280px; }
      button {
        margin-top: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #f5f5f5;
        color: #020202;
        font-weight: 700;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- The app itself is the live site (see capacitor.config.json). This page
         only shows if the phone has never reached it. -->
    <div>
      <h2>GradeX BITM</h2>
      <p>Connect to the internet once to load the app. After that it opens offline.</p>
      <button onclick="location.href='https://bitm.gradex.bond'">Try again</button>
    </div>
  </body>
</html>
